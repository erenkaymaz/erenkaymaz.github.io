<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eren Kaymaz</title>
<meta name="description" content="Selam, ben Eren. Kısaca kendimden bahsettiğim küçük bir sayfa.">
<link rel="canonical" href="https://erenkaymaz.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b2433; --text: #eef3f4; --muted: #93aab3; --accent: #f08a62; --accent2: #3f8a78; --sun: #f2b84b;
    --line: #1f4152; --soft: #0f2e40; --card: #0e2a3a; --contact: #c9583a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(ellipse at 50% 0%, #12384d 0%, var(--bg) 70%) fixed var(--bg); color: var(--text); font: 17px/1.7 "Inter", system-ui, sans-serif; overflow-x: hidden; }
  #sea { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 20px; zoom: .95; }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; font-weight: 600; letter-spacing: -0.01em; }

  /* Hero */
  .hero { display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: center; padding: 72px 0 32px; }
  .hello { color: var(--accent); font-weight: 500; margin: 0 0 6px; }
  h1 { font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 1.05; margin: 0 0 14px; }
  .tagline { font-size: 1.15rem; color: var(--muted); margin: 0 0 24px; }
  .intro p { margin: 0 0 12px; }
  .side { justify-self: center; display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
  .clock { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .clock #ctime { font: 600 1.6rem "Fraunces", Georgia, serif; color: var(--text); }
  .clock #cdate { font-size: .85rem; color: var(--muted); letter-spacing: .06em; }
  .frame { position: relative; aspect-ratio: 4 / 5; max-width: 180px; justify-self: center; width: 180px; }
  .frame .blob { position: absolute; inset: -8% -10% -6% -8%; width: 118%; height: 114%; z-index: 0; }
  .frame .photo {
    position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover;
    border-radius: 100px 100px 14px 14px; object-position: center 20%; background: var(--card); border: 4px solid var(--card);
    box-shadow: 0 20px 40px -18px rgba(0,0,0,.35);
  }
  .frame .sticker {
    position: absolute; z-index: 2; left: -18px; top: 56%; background: var(--card); border-radius: 999px;
    padding: 8px 16px 8px 10px; font-size: .9rem; display: flex; gap: 8px; align-items: center;
    box-shadow: 0 8px 20px -10px rgba(0,0,0,.35);
  }
  .frame .sticker svg { width: 26px; height: 26px; }

  /* Sections */
  section { padding: 44px 0; }
  h2 { font-size: 1.7rem; margin: 0 0 24px; display: flex; align-items: center; gap: 12px; }
  h2 svg { width: 34px; height: 34px; flex-shrink: 0; }

  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 440px; }
  .fact { background: rgba(14, 42, 58, .82); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
  .fact svg { width: 100%; height: 60px; display: block; }
  .fact p { margin: 0; }

  .now { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .now div { display: flex; gap: 14px; align-items: center; background: var(--soft); border-radius: 16px; padding: 16px 18px; }
  .now .ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex-shrink: 0; color: #fff; }
  .now .ic svg { width: 24px; height: 24px; }
  .now b { display: block; font-weight: 500; font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }

  .contact { background: rgba(14, 42, 58, .82); backdrop-filter: blur(6px); border: 1px solid var(--line); color: var(--text); border-radius: 18px; padding: 32px 26px; position: relative; overflow: hidden; margin: 16px auto 0; width: 80%; }
  .contact h2 { color: var(--text); margin-bottom: 16px; font-size: 1.36rem; }
  .contact p { margin: 0 0 22px; opacity: .9; max-width: 420px; }
  .contact .deco { position: absolute; right: -24px; top: -24px; width: 176px; height: 176px; opacity: .25; }
  .msg { background: rgba(14, 42, 58, .82); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 18px; padding: 21px 19px; margin: 0 auto 56px; width: 80%; }
  .msg h3 { font-size: .96rem; margin: 0 0 11px; }
  .msg textarea, .msg input[type=email] { width: 100%; background: var(--soft); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 11px; font: inherit; font-size: .8rem; }
  .msg textarea { min-height: 77px; resize: vertical; }
  .msg input[type=email] { margin-top: 8px; }
  .msg textarea:focus, .msg input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .msg .row { display: flex; align-items: center; gap: 11px; margin-top: 10px; flex-wrap: wrap; }
  .msg button { background: var(--accent); color: #1a120e; border: 0; border-radius: 999px; padding: 8px 18px; font: 500 .8rem "Inter", sans-serif; cursor: pointer; }
  .msg button:disabled { opacity: .5; cursor: default; }
  .msg .note { font-size: .72rem; color: var(--muted); }
  .msg .hp { position: absolute; left: -9999px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; position: relative; }
  .links a { display: inline-flex; align-items: center; gap: 8px; color: #1f1d1a; background: #fff; text-decoration: none;
    border-radius: 999px; padding: 7px 14px; font-size: .82rem; font-weight: 500; transition: transform .15s; }
  .links a:hover, .links a:focus-visible { transform: translateY(-2px); }
  .links svg { width: 15px; height: 15px; }

  footer { color: var(--muted); font-size: .85rem; padding: 32px 0 48px; }

  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; gap: 36px; padding-top: 48px; }
    .side { order: -1; align-items: center; }
    .clock { align-items: center; }
    .frame { max-width: 160px; width: 160px; }
    .facts { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .fact { padding: 10px; border-radius: 14px; }
    .fact svg { height: 64px; }
    .frame .sticker { left: -6px; }
    .contact, .msg { width: 100%; }
  }
</style>
</head>
<body>
<canvas id="sea" aria-hidden="true"></canvas>
<div class="wrap">

  <header class="hero">
    <div>
      <h1>Eren Kaymaz</h1>
    </div>

    <div class="side">
      <div class="clock" id="clock" aria-live="off"><span id="ctime">--:--:--</span><span id="cdate">--/--/----</span></div>
    <div class="frame">
      <img class="photo" src="eren.jpg" alt="Eren Kaymaz">
    </div>
    </div>
  </header>

  <section>
    <div class="facts">
      <div class="fact">
        <svg viewBox="0 0 200 110" aria-hidden="true">
          <path d="M98 12 L98 78 L48 78z" fill="var(--sun)"/>
          <path d="M104 22 L104 78 L146 78z" fill="#f2efe9"/>
          <path d="M100 10v74" stroke="var(--muted)" stroke-width="3"/>
          <path d="M40 84h120l-14 16H54z" fill="var(--accent)"/>
          <path d="M20 104q10-5 20 0t20 0 20 0 20 0 20 0 20 0 20 0 20 0" fill="none" stroke="var(--accent2)" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="fact">
        <svg viewBox="0 0 200 110" aria-hidden="true">
          <polygon points="112.0,58.0 119.6,63.6 118.2,69.1 108.9,70.7 106.7,74.5 109.5,83.5 105.2,87.1 96.7,82.9 92.7,84.6 89.6,93.6 84.0,94.0 79.6,85.7 75.3,84.6 67.7,90.1 62.8,87.1 64.2,77.8 61.3,74.5 51.9,74.3 49.8,69.1 56.3,62.4 56.0,58.0 48.4,52.4 49.8,46.9 59.1,45.3 61.3,41.5 58.5,32.5 62.8,28.9 71.3,33.1 75.3,31.4 78.4,22.4 84.0,22.0 88.4,30.3 92.7,31.4 100.3,25.9 105.2,28.9 103.8,38.2 106.7,41.5 116.1,41.7 118.2,46.9 111.7,53.6" fill="var(--accent2)"/><circle cx="84" cy="58" r="10" fill="var(--card)"/>
          <polygon points="147.7,43.1 152.4,48.3 150.3,52.1 143.4,51.3 140.9,53.3 140.5,60.3 136.4,61.6 132.1,56.0 128.9,55.7 123.7,60.4 119.9,58.3 120.7,51.4 118.7,48.9 111.7,48.5 110.4,44.4 116.0,40.1 116.3,36.9 111.6,31.7 113.7,27.9 120.6,28.7 123.1,26.7 123.5,19.7 127.6,18.4 131.9,24.0 135.1,24.3 140.3,19.6 144.1,21.7 143.3,28.6 145.3,31.1 152.3,31.5 153.6,35.6 148.0,39.9" fill="var(--sun)"/><circle cx="132" cy="40" r="6" fill="var(--card)"/>
          <polygon points="147.0,87.0 151.2,90.9 149.8,94.2 144.0,93.6 142.1,95.2 141.7,101.0 138.2,101.8 135.0,97.0 132.6,96.5 127.8,99.8 125.0,97.6 126.8,92.1 125.7,89.9 120.2,88.2 120.1,84.6 125.5,82.6 126.5,80.4 124.4,75.0 127.2,72.7 132.1,75.7 134.5,75.1 137.4,70.1 140.9,70.8 141.6,76.5 143.6,78.0 149.3,77.2 151.0,80.3 146.9,84.5" fill="var(--accent)"/><circle cx="136" cy="86" r="4" fill="var(--card)"/>
        </svg>
      </div>
      <div class="fact">
        <svg viewBox="0 0 200 110" aria-hidden="true">
          <path d="M100 30 C80 18 54 18 36 24 V92 C54 86 80 86 100 98z" fill="var(--accent)"/>
          <path d="M100 30 C120 18 146 18 164 24 V92 C146 86 120 86 100 98z" fill="var(--accent2)"/>
          <path d="M100 30V98" stroke="var(--bg)" stroke-width="2"/>
          <path d="M48 40c14-4 30-4 42 2M48 52c14-4 30-4 42 2M48 64c14-4 30-4 42 2M110 42c12-6 28-6 42-2M110 54c12-6 28-6 42-2M110 66c12-6 28-6 42-2" fill="none" stroke="#f2efe9" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M128 22v26l7-6 7 6V20" fill="var(--sun)"/>
        </svg>
      </div>
    </div>
  </section>

  <section>
    <div class="contact">
      <h2>İletişim</h2>
      <div class="links">
        <a href="mailto:erenkymz@gmail.com"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>E-posta</a>
        <a href="https://www.linkedin.com/in/eren-kaymaz/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/></svg>LinkedIn</a>
        <a href="https://www.instagram.com/erenkymz/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5v.01"/></svg>Instagram</a>
      </div>
    </div>
  </section>

  <section class="msg" aria-labelledby="msg-h">
    <h3 id="msg-h">Mesaj Gönder</h3>
    <form id="msgform">
      <textarea name="mesaj" id="mesaj" maxlength="1000" required placeholder="Mesajın..."></textarea>
      <input type="email" name="email" placeholder="E-postan (cevap istersen, isteğe bağlı)">
      <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="row">
        <button type="submit" id="msgbtn">Gönder</button>
        <span class="note" id="msgnote" role="status"></span>
      </div>
    </form>
  </section>

</div>
<script>
  (function () {
    var t = document.getElementById('ctime'), d = document.getElementById('cdate');
    function p(n) { return String(n).padStart(2, '0'); }
    function tick() {
      var n = new Date();
      t.textContent = p(n.getHours()) + ':' + p(n.getMinutes()) + ':' + p(n.getSeconds());
      d.textContent = p(n.getDate()) + '/' + p(n.getMonth() + 1) + '/' + n.getFullYear();
    }
    tick(); setInterval(tick, 1000);
  })();
</script>
<script>
  (function () {
    var f = document.getElementById('msgform'), btn = document.getElementById('msgbtn'), note = document.getElementById('msgnote');
    var KEY = 'msg-last', HOUR = 3600000;
    function last() { try { return +localStorage.getItem(KEY) || 0; } catch (e) { return 0; } }
    function wait() { return Math.max(0, last() + HOUR - Date.now()); }
    function lock() {
      var w = wait();
      btn.disabled = w > 0;
      if (w > 0) note.textContent = 'Mesajın ulaştı, teşekkürler. Yeni mesaj için ' + Math.ceil(w / 60000) + ' dk sonra tekrar dene.';
    }
    lock(); setInterval(lock, 30000);
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      if (wait() > 0) return lock();
      var data = new FormData(f);
      if (data.get('_honey')) return;
      btn.disabled = true; note.textContent = 'Gönderiliyor...';
      fetch('https://formsubmit.co/ajax/erenkymz@gmail.com', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          _subject: 'erenkaymaz.com üzerinden yeni mesaj',
          _template: 'box',
          mesaj: data.get('mesaj'),
          email: data.get('email') || '-'
        })
      }).then(function (r) { return r.json(); }).then(function (r) {
        if (String(r.success) !== 'true') throw 0;
        try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
        f.reset(); lock();
      }).catch(function () {
        btn.disabled = false; note.textContent = 'Gönderilemedi, birazdan tekrar dene.';
      });
    });
  })();
</script>
<script>
  (function () {
    var c = document.getElementById('sea'), x = c.getContext('2d');
    if (!x) { c.style.display = 'none'; return; }
    var layers = [
      { y: .38, amp: 10, len: 260, sp: 14, col: '#0f3a50' },
      { y: .50, amp: 14, len: 220, sp: -20, col: '#0c3045' },
      { y: .62, amp: 14, len: 210, sp: 28, col: '#09263a' },
      { y: .76, amp: 14, len: 200, sp: -36, col: '#061c2c' },
      { y: .90, amp: 12, len: 240, sp: 46, col: '#04131f' }
    ];
    var fish = [
      { layer: 0, y: .47, dir: 1, sp: 38, size: 15, col: '#f08a62', off: 0 },
      { layer: 1, y: .58, dir: -1, sp: 52, size: 12, col: '#f2b84b', off: .35 },
      { layer: 2, y: .70, dir: 1, sp: 30, size: 18, col: '#e9a07a', off: .7 },
      { layer: 3, y: .83, dir: -1, sp: 44, size: 14, col: '#f2b84b', off: .15 },
      { layer: 1, y: .64, dir: 1, sp: 60, size: 10, col: '#9fd3d8', off: .55 }
    ];
    function drawFish(F, w, h, time, k) {
      var s = F.size * Math.min(k, 1.6), span = w + s * 8;
      var px = ((F.off * span + time * F.sp) % span) - s * 4;
      if (F.dir < 0) px = w - px;
      var py = F.y * h + Math.sin(time * 1.3 + F.off * 10) * s * .6;
      var wig = Math.sin(time * 9 + F.off * 20) * .35;
      x.save(); x.translate(px, py); x.scale(F.dir, 1); x.globalAlpha = .85;
      x.fillStyle = F.col;
      x.beginPath(); x.ellipse(0, 0, s * 1.4, s * .62, 0, 0, Math.PI * 2); x.fill();
      x.save(); x.translate(-s * 1.25, 0); x.rotate(wig);
      x.beginPath(); x.moveTo(0, 0); x.lineTo(-s * .95, -s * .6); x.lineTo(-s * .75, 0); x.lineTo(-s * .95, s * .6); x.closePath(); x.fill();
      x.restore();
      x.beginPath(); x.moveTo(-s * .2, -s * .5); x.lineTo(s * .3, -s * .95); x.lineTo(s * .45, -s * .45); x.closePath(); x.fill();
      x.globalAlpha = 1; x.fillStyle = '#071a25';
      x.beginPath(); x.arc(s * .8, -s * .12, s * .13, 0, Math.PI * 2); x.fill();
      x.restore();
    }
    function draw(time) {
      var w = innerWidth, h = innerHeight, d = Math.min(devicePixelRatio || 1, 2);
      if (c.width !== Math.round(w * d) || c.height !== Math.round(h * d)) { c.width = Math.round(w * d); c.height = Math.round(h * d); }
      x.setTransform(d, 0, 0, d, 0, 0);
      var sky = x.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, '#0b2f44'); sky.addColorStop(1, '#071a25');
      x.fillStyle = sky; x.fillRect(0, 0, w, h);
      var k = Math.min(h / 300, 2.2), ls = Math.max(w / 520, 1);
      layers.forEach(function (L, i) {
        var len = L.len * ls;
        x.beginPath(); x.moveTo(0, h);
        for (var px = 0; px <= w + 8; px += 8) {
          var yy = L.y * h + Math.sin((px + time * L.sp * ls) / len * 6.283) * L.amp * k + Math.sin((px - time * L.sp * ls * .6) / (len * .47) * 6.283) * L.amp * .35 * k;
          x.lineTo(px, yy);
        }
        x.lineTo(w, h); x.closePath(); x.fillStyle = L.col; x.fill();
        x.strokeStyle = 'rgba(190, 225, 235, ' + (0.10 + i * 0.03) + ')'; x.lineWidth = 1.5; x.stroke();
        fish.forEach(function (F) { if (F.layer === i) drawFish(F, w, h, time, k); });
      });
    }
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches, t0 = performance.now(), last = 0;
    function frame(now) {
      if (now - last > 33) { last = now; draw(20 + (now - t0) / 1000); }
      if (!still) requestAnimationFrame(frame);
    }
    addEventListener('resize', function () { if (still) draw(20); });
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
